<h1>Área do Administrador</h1>

<!-- Criar nova votação -->
<h2>Criar Nova Votação</h2>
<input [(ngModel)]="novoTitulo" placeholder="Título da votação">
<input [(ngModel)]="novaDescricao" placeholder="Descrição da votação">
<button (click)="criarVotacao()">Criar Votação</button>

<hr>

<!-- Listar votações -->
<h2>Votações Existentes</h2>
<div *ngFor="let votacao of votacoes">
  <h3>{{votacao.titulo}}</h3>
  <p>{{votacao.descricao}}</p>
  <button (click)="selecionarVotacao(votacao.id)">Gerenciar Candidatos</button>

  <!-- Se esta votação estiver selecionada -->
  <div *ngIf="votacaoSelecionadaId === votacao.id">
    <h4>Adicionar Novo Candidato</h4>
    <input [(ngModel)]="nomeCandidato" placeholder="Nome do candidato">
    <input [(ngModel)]="partidoCandidato" placeholder="Partido">
    <input [(ngModel)]="fotoUrlCandidato" placeholder="URL da Foto (opcional)">
    <button (click)="adicionarCandidato()">Adicionar Candidato</button>

    <h4>Lista de Candidatos</h4>
    <ul>
      <li *ngFor="let candidato of votacao.candidatos">
        {{candidato.nome}} - {{candidato.partido}}
        <button (click)="editarCandidato(votacao.id, candidato.id)">Editar</button>
        <button (click)="excluirCandidato(votacao.id, candidato.id)">Excluir</button>
      </li>
    </ul>
  </div>

  <hr>
</div>
