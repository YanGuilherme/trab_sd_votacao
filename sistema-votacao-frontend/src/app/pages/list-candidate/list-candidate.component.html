<div class="container">
  <h2>Bem vindo</h2>
  <h4>
    Logado como: {{ returnNick() }} <button (click)="logout()">Sair</button>
  </h4>

  <button class="add-candidato" (click)="abrirModal()">
    Adicionar candidato
  </button>

  <h3 class="titulo">Candidatos/Filmes:</h3>

  <div class="lista-candidatos">
    @for (candidato of candidatos; track candidato.nome) {
    <div class="card">
      <app-candidate
        [nome]="candidato.nome"
        [foto]="candidato.foto"
        [quantidadeVotos]="candidato.quantidadeVotos"
      />
      <button class="votar" (click)="votar(candidato.id)">Votar</button>
    </div>
    }
  </div>
</div>

<!-- Modal -->
@if(mostrarModal){
<div class="modal-backdrop">
  <div class="modal">
    <label>Nome</label>
    <input [(ngModel)]="novoCandidato.nome" type="text" />

    <label>Link da foto</label>
    <input [(ngModel)]="novoCandidato.foto" type="text" />

    <button class="criar" (click)="adicionarCandidato()">Criar</button>
  </div>
</div>
}
